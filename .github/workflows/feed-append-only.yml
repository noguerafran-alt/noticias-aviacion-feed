name: feed-append-only
on:
  push:
    branches: [main]
    paths:
      - noticias-feed.json
      - pending-notes.json
jobs:
  never-shrink:
    if: "!startsWith(github.event.head_commit.message, 'restore') && !startsWith(github.event.head_commit.message, 'restore+merge')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Restaurar o mergear pending
        run: python3 .github/scripts/restore_if_shrunk.py
