name: feed-append-only
on:
  push:
    branches: [main]
    paths:
      - noticias-feed.json
jobs:
  never-shrink:
    if: ${{ github.event.head_commit.message != 'restore: no borrar notas del feed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restaurar si achicó el JSON
        run: python3 .github/scripts/restore_if_shrunk.py
